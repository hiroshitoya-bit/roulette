<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>円形ルーレット</title>
<style>
:root{color-scheme:dark;font-family:'Yu Gothic','Meiryo',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f7f8;min-height:100vh;display:flex;align-items:center;justify-content:center}.app{width:min(100%,950px);padding:20px;text-align:center}h1{font-size:clamp(20px,3vw,30px);margin:0 0 12px}.wheel-wrap{width:min(70vh,75vw,560px);aspect-ratio:1;position:relative;margin:12px auto}.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 18px #0007)}.pointer{position:absolute;z-index:2;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid #e8ff43;filter:drop-shadow(0 2px 3px #0008)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:11%;height:11%;border-radius:50%;background:#101820;border:5px solid #f4f7f9;box-shadow:0 2px 8px #0008}.status{font-size:clamp(17px,2.7vw,25px);font-weight:700;min-height:2em;margin:12px 0}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 22px;background:#e8ff43;color:#101820;font-size:17px;font-weight:800;cursor:pointer}button.secondary{background:#34424e;color:white}.settings{margin:16px auto 0;max-width:650px;text-align:left}details{background:#1b2934;border-radius:12px;padding:12px 16px}summary{cursor:pointer;font-weight:700}textarea{display:block;width:100%;height:110px;margin:10px 0;background:#0f1b24;color:#fff;border:1px solid #667682;border-radius:8px;padding:10px;font:15px/1.5 inherit}.help{font-size:13px;color:#b9c5ce;line-height:1.6;margin:8px 0}#result{color:#e8ff43}body.embed .app{padding:6px}body.embed h1,body.embed .settings{display:none}body.embed .wheel-wrap{width:min(73vh,90vw,560px)}@media(max-height:560px){.wheel-wrap{width:min(60vh,70vw,400px)}.status{margin:4px}}
</style>
</head>
<body><main class="app"><h1>ルーレット</h1><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" class="wheel" width="900" height="900" role="img" aria-label="円形ルーレット"></canvas><div class="center"></div></div><div class="status" aria-live="polite" id="status">Enterキーでスタート</div><div class="controls"><button id="action">スタート</button><button id="reset" class="secondary">リセット</button></div><section class="settings"><details><summary>項目を編集する</summary><p class="help">1行につき1項目（2〜20項目）。「適用」で円盤を更新します。回転中は変更できません。</p><textarea id="items">1\n2\n3\n4\n5\n6\n7\n8</textarea><button id="apply" class="secondary">項目を適用</button></details><p class="help">Enter：開始／停止指示　Space：開始／停止指示　R：リセット。停止指示後は自然に減速します。PowerPoint内のWeb表示アドインでは、ルーレットにキーボードフォーカスがある場合に限りEnter操作ができます。</p></section></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),action=document.getElementById('action');
const TAU=Math.PI*2;let items=['1','2','3','4','5','6','7','8'],angle=0,mode='idle',last=0,velocity=0,stopStart=0,stopFrom=0,stopTo=0,stopDuration=0,raf=0;
const colors=['#b7e4ee','#f6ce70','#b9e5c8','#eeaea6','#d3c1ef','#b1d6f9','#f1d6a5','#a8e0d7','#f4b4d4','#d8e2a4'];
function draw(){const w=canvas.width,c=w/2,r=w*.475,n=items.length,step=TAU/n;ctx.clearRect(0,0,w,w);ctx.save();ctx.translate(c,c);ctx.rotate(angle);for(let i=0;i<n;i++){const a=-Math.PI/2-step/2+i*step,b=a+step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,b);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();ctx.save();const mid=a+step/2;ctx.rotate(mid);ctx.translate(r*.66,0);ctx.rotate(Math.PI/2);ctx.fillStyle='#16212b';ctx.textAlign='center';ctx.textBaseline='middle';let font=Math.min(49,Math.max(18,240/n));ctx.font=`bold ${font}px sans-serif`;let t=items[i];while(ctx.measureText(t).width>r*.57&&font>13){font-=2;ctx.font=`bold ${font}px sans-serif`;}if(ctx.measureText(t).width>r*.57)t=t.slice(0,8)+'…';ctx.fillText(t,0,0);ctx.restore();}ctx.restore();}
function winner(){const step=TAU/items.length;const index=((Math.round(-angle/step)%items.length)+items.length)%items.length;return items[index];}
function random(){const a=new Uint32Array(1);if(globalThis.crypto?.getRandomValues){crypto.getRandomValues(a);return a[0]/4294967296;}return Math.random();}
function tick(t){if(mode==='spinning'){if(last)angle+=velocity*(t-last)/1000;last=t;draw();raf=requestAnimationFrame(tick);}else if(mode==='stopping'){const p=Math.min(1,(t-stopStart)/stopDuration),ease=1-Math.pow(1-p,4);angle=stopFrom+(stopTo-stopFrom)*ease;draw();if(p<1)raf=requestAnimationFrame(tick);else{mode='idle';status.innerHTML='結果：<span id="result"></span>';document.getElementById('result').textContent=winner();action.textContent='もう一度回す';}}}
function start(){if(mode!=='idle')return;mode='spinning';velocity=TAU*2.1;last=0;status.textContent='回転中… Enterキーでストップ';action.textContent='ストップ';raf=requestAnimationFrame(tick);}
function stop(){if(mode!=='spinning')return;cancelAnimationFrame(raf);mode='stopping';const step=TAU/items.length;const selected=Math.floor(random()*items.length);const laps=4+Math.floor(random()*3);const normalized=((angle%TAU)+TAU)%TAU;const desired=(((-selected*step)%TAU)+TAU)%TAU;const delta=((desired-normalized+TAU)%TAU);stopFrom=angle;stopTo=angle+laps*TAU+delta;stopDuration=2800+random()*900;stopStart=performance.now();status.textContent='減速中…';action.textContent='停止しています';raf=requestAnimationFrame(tick);}
function reset(){cancelAnimationFrame(raf);mode='idle';angle=0;last=0;draw();status.textContent='Enterキーでスタート';action.textContent='スタート';}
function toggle(){if(mode==='idle')start();else if(mode==='spinning')stop();}
action.addEventListener('click',toggle);document.getElementById('reset').addEventListener('click',reset);document.getElementById('apply').addEventListener('click',()=>{if(mode!=='idle'){alert('停止後に項目を変更してください。');return;}const a=document.getElementById('items').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(a.length<2||a.length>20){alert('項目は2〜20個にしてください。');return;}items=a;reset();});document.addEventListener('keydown',e=>{if(e.target.closest('textarea, input'))return;if(e.key==='Enter'||e.code==='Space'){e.preventDefault();if(!e.repeat)toggle();}else if(e.key.toLowerCase()==='r'){e.preventDefault();reset();}});if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');draw();
})();
</script></body></html>
